  <div class="world-map">
    <div class="world-map-bar"><div class="world-map-title"><strong>{{mapTitle}}</strong><span id="mapStatus">Loading preserved geography&hellip;</span></div>
      <div class="map-search">
        <input type="search" id="ledgerFilter" placeholder="Search islands, zones, ore, wood&hellip;" aria-label="Search the release world" autocomplete="off" role="combobox" aria-expanded="false" aria-controls="mapSearchResults">
        <div class="map-search-results" id="mapSearchResults" role="listbox"></div>
      </div>
      <div class="map-controls">
        <label class="map-toggle"><input type="checkbox" id="mapBiomes" checked>zones</label>
        <label class="map-toggle"><input type="checkbox" id="mapIslands" checked>islands</label>
        <label class="map-toggle"><input type="checkbox" id="mapWalls" checked>walls</label>
        <label class="map-toggle"><input type="checkbox" id="mapShips" checked>ships</label>
        <label class="map-toggle"><input type="checkbox" id="mapPlayers" checked>players</label>
        <label class="map-toggle"><input type="checkbox" id="mapFauna" checked>wildlife</label>
        <button type="button" id="mapZoomIn" aria-label="Zoom map in">+</button><button type="button" id="mapZoomOut" aria-label="Zoom map out">&minus;</button><button type="button" id="mapReset">Whole world</button>
      </div>
    </div>
{{mapProvenance}}
    <div class="world-map-body">
    <div class="world-map-stage"><svg id="liveWorldMap" role="img" aria-label="Preserved release-world map evidence - tiered biome cells, Haven corridor, weather walls and island placements - with a live overlay of authoritative ships, players and currently simulated island domains"><defs><symbol id="releaseIslandSymbol" viewBox="-90 -90 180 180"><path d="M0 -70 62 -22 48 54 -8 72 -67 30 -55 -38Z"></path></symbol><symbol id="havenIslandSymbol" viewBox="-110 -110 220 220"><circle r="80"></circle><path d="M0 -58 51 -18 39 44 -6 59 -55 25 -45 -31Z" fill="#d6fff0"></path></symbol><symbol id="shipSymbol" viewBox="-170 -170 340 340"><path d="M0 -150 92 92 0 40 -92 92Z"></path></symbol><symbol id="playerSymbol" viewBox="-145 -145 290 290"><circle r="105"></circle></symbol><symbol id="mantaSymbol" viewBox="-100 -100 200 200"><path d="M0 -76 C30 -50 60 -6 74 34 C44 26 20 18 0 18 C-20 18 -44 26 -74 34 C-60 -6 -30 -50 0 -76 Z"></path><path d="M-5 14 L5 14 L2 90 L-2 90 Z"></path></symbol><symbol id="jellySymbol" viewBox="-100 -100 200 200"><path d="M0 -58 C38 -58 60 -30 60 0 C60 10 52 18 40 20 C20 24 -20 24 -40 20 C-52 18 -60 10 -60 0 C-60 -30 -38 -58 0 -58 Z"></path><path d="M-34 20 L-24 20 L-18 78 L-30 70 Z M-6 22 L6 22 L4 90 L-4 90 Z M24 20 L34 20 L30 70 L18 78 Z" opacity=".78"></path></symbol><clipPath id="worldClip"><rect id="worldClipRect"></rect></clipPath></defs><rect id="mapOcean" class="map-ocean"></rect><g clip-path="url(#worldClip)"><g id="mapBiomeLayer"></g><g id="mapHavenLayer"></g><g id="mapGrid" class="map-grid"></g><g id="mapWallLayer"></g><g id="mapShellLayer" class="map-shell-layer"></g><g id="mapIslandLayer"></g><g id="mapRuntimeIslandLayer"></g><g id="mapFaunaLayer" class="map-fauna-layer"></g><g id="mapShipHullLayer"></g><g id="mapShipLayer"></g><g id="mapPlayerLayer"></g></g><rect id="mapWorldBoundary" class="map-world-boundary"></rect></svg><div class="map-hover" id="mapHover" role="tooltip"></div><div class="map-compass">N</div><div class="map-zoomlevel" id="mapZoomLevel">whole world</div><div class="map-scalebar"><div class="bar" id="mapScaleBar"></div><div class="lbl" id="mapScale">6 km</div></div><div class="map-hint" id="mapHint">Drag to pan &middot; pinch or scroll to zoom &middot; click an island for its full inventory</div><div class="map-empty" id="mapLiveNote">No live positions reported.</div></div>
    <aside class="map-detail" id="mapDetail" aria-live="polite" aria-label="Selected map feature"></aside>
    </div>
{{mapLegend}}
{{mapAuthenticity}}

  </div>
