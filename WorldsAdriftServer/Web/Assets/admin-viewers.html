<div class="card">
  <div class="row"><div class="grow"><h2>Map audience</h2></div><div class="fit"><span class="pill" id="viewerRecording">&hellip;</span></div></div>
  <p class="lede" style="margin-top:0">How many browser tabs have the public map at <code>/map</code> open. Tabs, not people, and nothing is recorded but a count per minute &mdash; there is no per-viewer detail behind this login because none is kept anywhere.</p>
  <div class="grid">
    <div class="stat"><div class="n" id="viewersNow">&mdash;</div><div class="l">Watching now</div></div>
    <div class="stat"><div class="n" id="viewersPeak30">&mdash;</div><div class="l">Peak, 30 days</div></div>
    <div class="stat"><div class="n" id="viewersPeakAll">&mdash;</div><div class="l">Peak, all time</div></div>
    <div class="stat"><div class="n" id="viewersMinutes">&mdash;</div><div class="l">Minutes recorded</div></div>
  </div>
  <div class="spark" id="adminViewerSpark" style="max-width:none"></div>
</div>
