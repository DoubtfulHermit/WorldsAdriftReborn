[Service]
# Pack C production acceptance: deterministic 50 Hz ship stepping with a
# bounded 25-step/500 ms catch-up cap. This same opt-in also writes and restores
# additive durable flight checkpoints; pilots and held controls are never
# restored across a process restart.
#
# Roll back by setting this to 0 (or removing the drop-in) and restarting. The
# legacy pose fields remain current, and the next pose-only persistence pass
# clears any stale checkpoint.
Environment=WAREBORN_FLIGHT_FIXED_STEP=1
